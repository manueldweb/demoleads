<!-- REEMPLAZA EL <form id="leadForm"> POR ESTE -->
<form id="leadForm" class="space-y-4">
  <div>
    <label for="nombre" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Nombre completo</label>
    <input type="text" id="nombre" name="nombre" required placeholder="Ej. Camila Mendoza"
      class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition" />
  </div>

  <div>
    <label for="whatsapp" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Tu WhatsApp (con código de país)</label>
    <input type="tel" id="whatsapp" name="whatsapp" required placeholder="Ej. +58 412 555 0192"
      class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition" />
  </div>

  <div>
    <label for="servicio" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Tratamiento de interés</label>
    <select id="servicio" name="servicio" required
      class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition">
      <option value="" disabled selected>Selecciona una opción...</option>
      <option value="Valoración General">Valoración Inicial / Diagnóstico</option>
      <option value="Armonización Facial">Armonización Facial</option>
      <option value="Diseño de Sonrisa">Diseño de Sonrisa / Estética Dental</option>
      <option value="Tratamiento Láser">Rejuvenecimiento / Láser</option>
    </select>
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div>
      <label for="fecha" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Fecha de la cita</label>
      <input type="date" id="fecha" name="fecha" required
        class="w-full px-3.5 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition" />
    </div>

    <div>
      <label for="hora" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1.5">Hora preferida</label>
      <select id="hora" name="hora" required
        class="w-full px-3.5 py-3 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-teal-500 focus:border-transparent transition">
        <option value="09:00">09:00 AM</option>
        <option value="10:00">10:00 AM</option>
        <option value="11:00">11:00 AM</option>
        <option value="14:00">02:00 PM</option>
        <option value="15:00">03:00 PM</option>
        <option value="16:00">04:00 PM</option>
        <option value="17:00">05:00 PM</option>
      </select>
    </div>
  </div>

  <div id="estadoCita" class="hidden text-xs rounded-xl p-3 font-medium"></div>

  <div id="accionesConfirmacion" class="hidden space-y-2 pt-1">
    <a id="btnVerCalendario" href="#" target="_blank"
      class="block w-full text-center py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold transition">
      📅 Ver mi cita en el Calendario Web
    </a>
    <div class="grid grid-cols-2 gap-2">
      <a id="btnWaPaciente" href="#" target="_blank"
        class="text-center py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold transition">
        💬 Recordatorio Paciente
      </a>
      <a id="btnWaAdmin" href="#" target="_blank"
        class="text-center py-2.5 px-3 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-semibold transition">
        🔔 Avisar al Admin
      </a>
    </div>
  </div>

  <button type="submit" id="submitBtn"
    class="w-full py-3.5 px-6 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-semibold text-sm shadow-lg shadow-teal-600/25 transition flex items-center justify-center gap-2 cursor-pointer">
    <span>Verificar Disponibilidad y Agendar</span>
  </button>

  <p class="text-[11px] text-center text-slate-400 pt-1">
    🔒 Verificación automática en calendario para evitar cruces de horario.
  </p>
</form>

<!-- REEMPLAZA EL <script> DEL FINAL POR ESTE -->
<script>
  const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/TU_ID_DE_SCRIPT_AQUI/exec";

  const form = document.getElementById("leadForm");
  const submitBtn = document.getElementById("submitBtn");
  const estadoCita = document.getElementById("estadoCita");
  const accionesConfirmacion = document.getElementById("accionesConfirmacion");

  // Evitar seleccionar fechas pasadas
  const fechaInput = document.getElementById("fecha");
  fechaInput.min = new Date().toISOString().split("T")[0];

  function mostrarAlerta(tipo, texto) {
    estadoCita.classList.remove("hidden", "bg-red-50", "text-red-700", "border", "border-red-200", "bg-emerald-50", "text-emerald-800", "border-emerald-200");
    if (tipo === "error") {
      estadoCita.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
    } else {
      estadoCita.classList.add("bg-emerald-50", "text-emerald-800", "border", "border-emerald-200");
    }
    estadoCita.textContent = texto;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    accionesConfirmacion.classList.add("hidden");

    const originalHTML = submitBtn.innerHTML;
    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span>Verificando agenda...</span>`;

    const datos = {
      nombre: document.getElementById("nombre").value.trim(),
      whatsapp: document.getElementById("whatsapp").value.trim(),
      servicio: document.getElementById("servicio").value,
      fecha: document.getElementById("fecha").value,
      hora: document.getElementById("hora").value
    };

    try {
      // text/plain evita preflight CORS innecesario con Apps Script y permite leer la respuesta JSON
      const res = await fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(datos)
      });

      const data = await res.json();

      if (data.status === "conflict") {
        mostrarAlerta("error", "⚠️ " + data.message);
      } else if (data.status === "success") {
        mostrarAlerta("ok", `✅ ¡Cita confirmada! Código: ${data.citaId}. Ya quedó bloqueada en el calendario.`);
        document.getElementById("btnVerCalendario").href = data.linkCalendario;

        const btnPac = document.getElementById("btnWaPaciente");
        if (data.waPacienteUrl) {
          btnPac.href = data.waPacienteUrl;
          btnPac.classList.remove("opacity-50", "pointer-events-none");
        } else {
          btnPac.classList.add("opacity-50", "pointer-events-none");
        }

        document.getElementById("btnWaAdmin").href = data.waAdminUrl;
        accionesConfirmacion.classList.remove("hidden");
        form.reset();
        fechaInput.min = new Date().toISOString().split("T")[0];
      } else {
        mostrarAlerta("error", data.message || "No se pudo procesar la cita.");
      }
    } catch (err) {
      console.error(err);
      mostrarAlerta("error", "Error de conexión al verificar disponibilidad. Intenta de nuevo.");
    } finally {
      submitBtn.disabled = false;
      submitBtn.innerHTML = originalHTML;
    }
  });
</script>
