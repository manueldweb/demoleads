<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calendario de Citas | Clínica Aura</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .fc .fc-button-primary {
      background-color: #0d9488;
      border-color: #0d9488;
    }
    .fc .fc-button-primary:hover {
      background-color: #0f766e;
      border-color: #0f766e;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-lg bg-teal-600 text-white font-bold flex items-center justify-center">A</span>
        <span class="font-bold text-slate-900">Agenda <span class="text-teal-600">Clínica Aura</span></span>
      </div>
      <a href="index.html" class="text-xs sm:text-sm font-semibold bg-slate-900 hover:bg-slate-800 text-white px-4 py-2 rounded-full transition">
        + Nueva Cita
      </a>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div id="bannerCita" class="hidden mb-6 p-4 rounded-2xl bg-teal-50 border border-teal-200 text-teal-900 text-sm flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <span id="textoBannerCita">Consultando disponibilidad y agenda de citas.</span>
      <span class="text-xs font-semibold px-3 py-1 rounded-full bg-teal-600 text-white w-fit">Vista en tiempo real</span>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 sm:p-6">
      <div id="calendar"></div>
    </div>
  </main>

  <script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz_JPauYfYJTZ5Z-1NLyI7RQ8PWWcZCIb0iK2v0BtYYQsHZgYOKaY2LL7aNhBsTd2mS/exec";

    const params = new URLSearchParams(window.location.search);
    const citaParam = params.get("cita");
    const fechaParam = params.get("fecha");

    if (citaParam || fechaParam) {
      const banner = document.getElementById("bannerCita");
      const texto = document.getElementById("textoBannerCita");
      banner.classList.remove("hidden");
      texto.innerHTML = `📅 Mostrando agenda${fechaParam ? ` desde <strong>${fechaParam}</strong>` : ""}${citaParam ? ` • Referencia: <strong>${citaParam}</strong>` : ""}.`;
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const calendarEl = document.getElementById("calendar");
      let eventosCargados = [];

      try {
        const res = await fetch(GOOGLE_SCRIPT_URL);
        const data = await res.json();
        eventosCargados = (data.events || []).map(ev => ({
          ...ev,
          backgroundColor: ev.id === citaParam ? "#0f172a" : "#0d9488",
          borderColor: ev.id === citaParam ? "#0f172a" : "#0d9488"
        }));
      } catch (e) {
        console.error("Error cargando eventos:", e);
      }

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: window.innerWidth < 640 ? "timeGridDay" : "timeGridWeek",
        initialDate: fechaParam || undefined,
        locale: "es",
        slotMinTime: "08:00:00",
        slotMaxTime: "20:00:00",
        allDaySlot: false,
        nowIndicator: true,
        height: "auto",
        headerToolbar: {
          left: "prev,next today",
          center: "title",
          right: "dayGridMonth,timeGridWeek,timeGridDay"
        },
        events: eventosCargados,
        eventClick: function(info) {
          alert(`Cita: ${info.event.title}\nEstado: ${info.event.extendedProps.estado || "Confirmada"}`);
        }
      });

      calendar.render();
    });
  </script>
</body>
</html>
